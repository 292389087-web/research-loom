[project]
name = "research-loom"
version = "0.5.0"
description = "面向 AI 研究生的本地多模态研究规划 Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9",
  "pydantic>=2.8", "pymupdf>=1.24", "pillow>=10", "numpy>=1.26",
  "torch>=2.5", "transformers>=5.0", "accelerate>=0.33",
  "sentence-transformers>=3.0", "rank-bm25>=0.2.2", "httpx>=0.27", "optuna>=4,<6", "psutil>=5.9"
]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
